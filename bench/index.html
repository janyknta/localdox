<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Diagram benchmark</title>
    <style>
      body {
        margin: 0;
        font:
          13px system-ui,
          sans-serif;
        background: #fff;
        color: #111;
      }
      #status {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 2;
        background: #fffc;
        padding: 4px 8px;
      }
      #stage {
        width: 1200px;
        height: 760px;
        overflow: hidden;
        border: 1px solid #ddd;
        margin-top: 36px;
      }
      #stage > svg,
      #stage > canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="status">idle</div>
    <div id="stage" class="explainer-stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

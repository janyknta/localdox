[package]
name = "diagram-layout"
version = "0.1.0"
edition = "2021"
publish = false
description = "Layered (Sugiyama) graph layout for large Mermaid flowcharts, compiled to WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
